id = "y011d4.yoicks"
name = "Yoicks"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Monitor and control herdr agents from your phone or browser — a PWA + REST/WS bridge"
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "scripts/plugin-build.sh", "release"]

[[actions]]
id = "start"
title = "Start Yoicks bridge"
contexts = ["workspace"]
command = ["./bin/yoicks", "start"]

[[actions]]
id = "stop"
title = "Stop Yoicks bridge"
contexts = ["workspace"]
command = ["./bin/yoicks", "stop"]

[[actions]]
id = "status"
title = "Yoicks bridge status"
contexts = ["workspace"]
command = ["./bin/yoicks", "status"]

[[panes]]
id = "server"
title = "Yoicks bridge"
placement = "tab"
command = ["./bin/yoicks", "run"]

[[panes]]
id = "connect"
title = "Connect phone"
placement = "overlay"
command = ["./bin/yoicks", "qr"]

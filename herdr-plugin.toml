id = "y011d4.agentweb"
name = "Herdr Agent Web"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Monitor and control herdr agents from your phone or browser — a PWA + REST/WS bridge"
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "scripts/plugin-build.sh", "release"]

[[actions]]
id = "start"
title = "Start Agent Web bridge"
contexts = ["workspace"]
command = ["./bin/agentwebctl", "start"]

[[actions]]
id = "stop"
title = "Stop Agent Web bridge"
contexts = ["workspace"]
command = ["./bin/agentwebctl", "stop"]

[[actions]]
id = "status"
title = "Agent Web bridge status"
contexts = ["workspace"]
command = ["./bin/agentwebctl", "status"]

[[panes]]
id = "server"
title = "Agent Web bridge"
placement = "tab"
command = ["./bin/agentwebctl", "run"]

[[panes]]
id = "connect"
title = "Connect phone"
placement = "overlay"
command = ["./bin/agentwebctl", "qr"]

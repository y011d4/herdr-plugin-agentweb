<!DOCTYPE html>
<html lang="en" data-mantine-color-scheme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#111318" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Yoicks" />
  <title>Yoicks</title>
  <link rel="stylesheet" href="/app.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
</head>
<body>
  <div id="app">
    <!-- Top bar (hidden on login screen) -->
    <header id="topbar" class="topbar">
      <div id="topbar-left"></div>
      <div class="topbar-title" id="topbar-title">Yoicks</div>
      <div id="conn-dot" class="conn-dot" title="Disconnected"></div>
      <div id="topbar-right"></div>
    </header>

    <!-- Reconnecting banner -->
    <div id="reconnect-banner" role="status" aria-live="polite">
      <span class="loading-spinner" style="width:14px;height:14px;border-width:2px;"></span>
      Reconnecting&hellip;
    </div>

    <!-- Main screen (ui/App.tsx draws over this first paint) -->
    <main id="screen"></main>

    <!-- Toast container — fixed overlay; the toasts: ui/Toasts.tsx -->
    <div id="toast-container" aria-live="assertive" aria-atomic="false"></div>
  </div>

  <!-- Modal dialogs (ui/Modals.tsx), above everything -->
  <div id="modal-root"></div>

  <script type="module" src="/src/main.tsx"></script>
</body>
</html>

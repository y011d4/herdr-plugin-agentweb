name: CI

# ── Triggers ────────────────────────────────────────────────────────────────
# We deliberately use `pull_request`, NOT `pull_request_target`.
#   - `pull_request` checks out and runs the fork's code with a READ-ONLY
#     GITHUB_TOKEN and NO access to repository secrets. A malicious fork PR
#     therefore cannot steal secrets or push to this repo — the worst it can do
#     is waste its own run's compute.
#   - `pull_request_target` would run in the BASE-repo context, WITH secrets and
#     a read-write token. Checking out untrusted fork code under that trigger is
#     the classic "pwn request" vulnerability. This workflow never uses it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ── Least privilege ─────────────────────────────────────────────────────────
# This workflow only reads the repo (to check it out); it publishes nothing and
# uses no secrets. Grant the GITHUB_TOKEN read-only access at the top level so
# every job inherits the minimum. A job that ever needs more must opt in with
# its own `permissions:` block.
permissions:
  contents: read

# ── Concurrency ─────────────────────────────────────────────────────────────
# Cancel superseded runs on the same ref: faster feedback, and a burst of fork
# PR pushes cannot pile up concurrent jobs to burn Actions minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The web UI (web/): type checks, the Vite build, the JSON contract with the Go side, and
  # the Vitest tests. Node only builds and tests it (the shipped artifact is the Go binary),
  # so CI runs the one Node line package.json's engines names, as local builds do. The one
  # Go test that needs the built UI, TestWebBuild (embed_test.go), runs here too.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to a full commit SHA — a moved/retagged release cannot silently
      # swap the action out from under us. `persist-credentials: false` scrubs
      # the token from .git/config so later `run:` steps cannot reuse it.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json # its engines.node
          cache: npm

      # No `${{ github.event.* }}` (PR title, branch name, commit message, …)
      # is interpolated into any run step, so there is no shell-injection
      # surface. All commands below are static.
      # --ignore-scripts: a fork PR's dependency lifecycle scripts (pre/post
      # install) never execute in the runner. This repo needs none
      # (vite's native parts come as prebuilt platform packages). Drop this flag if you ever
      # add a dependency that legitimately requires a postinstall.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build the web UI (tsc type checks, vite build)
        run: npm run build:web

      # The Go bridge's JSON (testdata/contract, as typed literals in
      # web/test/contract.gen.ts) against the web's hand-written types.
      - name: Check the JSON contract with the Go bridge
        run: npm run check:contract

      - name: Test the web UI
        run: npm test

      # the embedded build's files, its .br/.gz copies and the size budgets; elsewhere
      # (the bridge jobs) it skips, as there is no web build
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          # its own cache (the build cache of the stdlib this test compiles), keyed apart from
          # the bridge jobs' (go.sum): sharing the key, whichever job saved first would leave
          # the other a cache without its packages
          cache-dependency-path: go.mod

      - name: Check the embedded web build (TestWebBuild)
        env:
          YOICKS_REQUIRE_WEB: "1" # a missing web/dist fails instead of skipping
        run: go test -count=1 -run '^TestWebBuild$' -v .

  # The Go side (the bridge and CLI): vet, tests with the race detector, govulncheck.
  # On each released OS/CPU family: linux/amd64 and linux/arm64
  # (supported), macOS on arm64 (experimental: unit tests; the /proc-based parts are refused
  # there). No Node: the Go code compiles without the web build (embed.go's placeholder),
  # and TestWebBuild, which needs it, runs in the web job. So the web build (its platform
  # packages: esbuild, rollup, Tailwind's oxide) is checked on linux/amd64 only, where the
  # releases are built; a source build elsewhere (plugin-build.sh) isn't. Same hardening as
  # above: pinned SHAs, no persisted token, read-only permissions.
  bridge:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # the live test against the real claude: compiled so it can't rot, never run here
      - name: Vet the claudelive test
        run: go vet -tags claudelive ./internal/bridge

      - name: Test (race detector)
        run: go test -race ./...

      # Known vulnerabilities in the module and its dependencies, pinned version.
      - name: govulncheck
        if: matrix.os == 'ubuntu-latest'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # The Pages site (site/: the landing and the VitePress docs), built as pages.yml builds it, so a PR finds a broken
  # page, link or anchor, or a docs page without its other language, before main deploys it. Its own npm project
  # (site/package.json): the app's dependencies and the web job stay as they are. Nothing is deployed here.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json # its engines.node, as site/package.json's
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build the site
        working-directory: site
        run: npm ci --ignore-scripts && npm run build

  # e2e's Tier 1 (tools/e2e.ts): the web UI in headless Chrome through a preview bridge, over a private
  # headless herdr (`e2e.ts herdr start`) and the fake claude: no desktop herdr, no real Claude (Tier 2 stays a
  # step by hand). herdr is the release binary of the version production runs (CLAUDE.md's herdr 0.9.5), checked
  # against the SHA-256 below (herdr publishes none): a release replaced under the same tag fails here, not runs.
  # Raising the version is a PR that changes both lines, and so runs this against the new herdr first.
  # It runs on pushes to main too, with no `if:`: main's run is the deploy gate (CLAUDE.md's deploy steps).
  # Tier 1 runs in two parts on two runners, each with its own herdr, bridge and Chrome: the items before
  # E2E_SPLIT and those from it on (`--until`/`--from`, one cut, so a new item lands in one of them). The cut
  # is where the two take about as long (~1 min each); the e2e job below is the one check for both.
  e2e-part:
    name: e2e (part ${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: 1
            range: --until
          - part: 2
            range: --from
    env:
      E2E_SPLIT: P12
      HERDR_VERSION: v0.9.5
      HERDR_SHA256: 14d9e8bc8b4a9e0118d77c32266f76d461f09b40342eb23752960bd89f59929d
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A fresh runner's disk is cold: Chrome's first start reads much of its install from it (0.6–17 s measured; its
      # second 0.1 s). One started here, in the background, does those reads while the builds run.
      - name: Warm Chrome up
        run: google-chrome-stable --headless=new --user-data-dir="$RUNNER_TEMP/chrome-warm" --dump-dom about:blank > /dev/null 2>&1 &

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json # its engines.node
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          # a key of its own (the web job's is go.mod, the bridge jobs' go.sum): see the web job's note
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Install herdr
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/herdr" "https://github.com/herdrdev/herdr/releases/download/$HERDR_VERSION/herdr-linux-x86_64"
          echo "$HERDR_SHA256  $RUNNER_TEMP/bin/herdr" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/herdr"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # the web build first: the bridge embeds it
      - name: Build the web UI, the bridge and the fake claude
        run: |
          npm ci --ignore-scripts
          npx vite build
          go build -o bin/yoicks ./cmd/yoicks
          go build -o "$RUNNER_TEMP/fake/claude" ./tools/fakeclaude

      - name: Tier 1, part ${{ matrix.part }}
        env:
          E2E_ROOT: ${{ runner.temp }}/e2e
          RANGE: ${{ matrix.range }}
        run: |
          node tools/e2e.ts herdr start
          node tools/e2e.ts preview start --bin bin/yoicks --fake-claude "$RUNNER_TEMP/fake/claude"
          node tools/e2e.ts check --base http://127.0.0.1:8395 --tier 1 "$RANGE" "$E2E_SPLIT"

      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-${{ matrix.part }}
          path: |
            ${{ runner.temp }}/e2e/preview-*/state/bridge.log
            ${{ runner.temp }}/e2e/herdr/server.log
            ${{ runner.temp }}/e2e/herdr/.config/herdr/herdr-server.log
          retention-days: 7
          if-no-files-found: ignore

  # The one e2e check (a required check has one name): green only when both parts passed. `always()`: a
  # skipped job counts as passed for a required check, so this one runs, and fails, after a failed or cancelled part.
  e2e:
    needs: e2e-part
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Both parts passed
        env:
          RESULT: ${{ needs.e2e-part.result }}
        run: test "$RESULT" = success

name: Screenshots

# What a web change looks like, on its PR: the PR's web build and main's (as the PR merges into it) are shot
# over tools/shots-fixture.ts's made-up data (`node tools/webcheck.ts shots`, headless Chrome, no herdr, no
# bridge), on a phone and a PC, and the screens whose pixels changed go into one comment, before | after,
# updated on each push. The fixture is all the shots ever see: they are public.
#
# `pull_request`, never `pull_request_target` (see ci.yml). Two jobs, so that the one running the PR's code and
# its npm dependencies (render) never holds a token that can write. publish runs none of it: it takes only the
# PNGs the manifest names, checks them, pushes them to refs/screenshots/pr-<n> (outside refs/heads: not in a
# clone, not in the branch list; each run replaces the last) and points the comment at that commit through
# raw.githubusercontent.com. Dependabot's PRs get the write token through the jobs' `permissions` too.
#
# Every PR push runs it, not only those a `paths` filter would match: that filter compares the whole PR with main,
# so a push taking the PR's last web change back wouldn't run it, and the comment would go on showing the change.
# render looks at the merge's diff itself and, when the web UI didn't change, shoots nothing (seconds).
on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    # a fork's PR gets no token that can write, so nothing of it could be published: skipped
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # the merge commit (after) and its first parent (before: main as GitHub merged the PR into it)
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # what the shots depend on; without a change there, an empty manifest: publish then only brings an earlier
      # comment up to date
      - name: Did the web UI change?
        id: diff
        run: |
          if git diff --quiet HEAD^1 HEAD -- web vite.config.ts package.json package-lock.json 'tsconfig*.json' \
            tools/webcheck.ts tools/shots-fixture.ts .github/workflows/screenshots.yml; then
            mkdir -p "$RUNNER_TEMP/shots" && echo '{"shots": []}' > "$RUNNER_TEMP/shots/manifest.json"
          else
            echo "web=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.diff.outputs.web
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json # its engines.node
          cache: npm

      # --ignore-scripts as in ci.yml. No tsc: ci.yml type-checks, the shots need the build only.
      - name: Build the web UI after the PR
        if: steps.diff.outputs.web
        run: npm ci --ignore-scripts && npx vite build

      - name: Build the web UI before it
        if: steps.diff.outputs.web
        run: |
          git worktree add "$RUNNER_TEMP/before" HEAD^1
          cd "$RUNNER_TEMP/before"
          npm ci --ignore-scripts
          npx vite build

      # the PR's harness and fixture shoot both builds: only the web build differs
      - name: Shoot
        if: steps.diff.outputs.web
        run: node tools/webcheck.ts shots --before "$RUNNER_TEMP/before/web/dist" --after web/dist --out "$RUNNER_TEMP/shots"

      - name: Upload the shots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shots
          path: ${{ runner.temp }}/shots
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # refs/screenshots/pr-<n>
      pull-requests: write # the comment
    steps:
      - name: Download the shots
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shots
          path: shots

      # Only event context (numbers, a SHA, this repo's name) reaches the script, through env; the artifact
      # (made by the PR's code) is data: each manifest entry must match a strict pattern, each file must be a
      # PNG of bounded size, and the comment is built from those checked names only.
      - name: Publish the changed screens and update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          marker='<!-- yoicks-shots -->'
          pub="$RUNNER_TEMP/pub"
          body="$RUNNER_TEMP/body.md"
          mkdir -p "$pub"
          cd shots
          jq -e '(.shots | type) == "array" and (.shots | length) <= 100' manifest.json > /dev/null
          changed=() same=() notready=()
          while IFS=$'\t' read -r n ch nr; do
            if [[ ! $n =~ ^[a-z0-9-]{1,64}$ || ! $ch =~ ^(true|false|null)$ || ! $nr =~ ^(|before|after|before,after)$ ]]; then
              echo "bad manifest entry"; exit 1
            fi
            if [[ -n $nr ]]; then notready+=("$n ($nr)"); fi
            if [[ $ch != true ]]; then same+=("$n"); continue; fi
            for side in before after; do
              f="$n.$side.png"
              if [[ ! -f $f || -L $f ]]; then continue; fi
              if [[ $(head -c 8 "$f" | od -An -tx1 | tr -d ' \n') != 89504e470d0a1a0a ]]; then echo "not a PNG: $f"; exit 1; fi
              if (( $(stat -c %s "$f") > 2000000 )); then echo "too big: $f"; exit 1; fi
              cp "$f" "$pub/"
            done
            changed+=("$n")
          done < <(jq -r '.shots[] | [.name, (.changed | tostring), (.notReady | join(","))] | @tsv' manifest.json)

          if (( ${#changed[@]} )); then
            cd "$pub"
            git init -q -b shots
            git add -A
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qm "screenshots of #$PR at $HEAD_SHA"
            sha=$(git rev-parse HEAD)
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c http.extraheader="AUTHORIZATION: basic $auth" push -qf "https://github.com/$REPO.git" "HEAD:refs/screenshots/pr-$PR"
          fi

          total=$(( ${#changed[@]} + ${#same[@]} ))
          {
            echo "$marker"
            if (( ${#changed[@]} )); then
              echo "**UI screenshots**: ${#changed[@]} of $total shots changed (${HEAD_SHA:0:7}). Made-up data: \`tools/shots-fixture.ts\`."
              for n in "${changed[@]}"; do
                w=260; if [[ $n == *-pc ]]; then w=440; fi
                cell() { if [[ -f $pub/$n.$1.png ]]; then echo "<img src=\"https://raw.githubusercontent.com/$REPO/$sha/$n.$1.png\" width=\"$w\">"; else echo "(none)"; fi; }
                printf '\n<details open><summary><code>%s</code></summary>\n\n| before | after |\n| --- | --- |\n| %s | %s |\n\n</details>\n' "$n" "$(cell before)" "$(cell after)"
              done
            elif (( total )); then
              echo "**UI screenshots**: no screen changed ($total shots, ${HEAD_SHA:0:7})."
            else
              echo "**UI screenshots**: the PR no longer changes the web UI (${HEAD_SHA:0:7})."
            fi
            if (( ${#notready[@]} )); then printf '\nNot ready within 10 s (shot anyway): %s\n' "${notready[*]}"; fi
            if (( ${#same[@]} )); then printf '\n<details><summary>Unchanged (%s)</summary>\n\n%s\n\n</details>\n' "${#same[@]}" "${same[*]}"; fi
          } > "$body"
          cat "$body" >> "$GITHUB_STEP_SUMMARY"

          # one comment per PR: updated in place; none is made just to say nothing changed
          ids=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")
          id=${ids%%$'\n'*}
          if [[ -n $id ]]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F "body=@$body" > /dev/null
          elif (( ${#changed[@]} )); then
            gh api "repos/$REPO/issues/$PR/comments" -F "body=@$body" > /dev/null
          fi

name: Screenshots

# What a web change looks like, on its PR: the PR's web build and main's (as the PR merges into it) are shot
# over tools/shots-fixture.ts's made-up data (`node tools/e2e.ts shots`, headless Chrome, no herdr, no
# bridge), on a phone and a PC: a full screen per kind of screen and the components cut out of them (agent card,
# Home status bar, chat items, answer panel, settings sections…: tools/shots-fixture.ts's `parts`), so a diff names
# the component that changed. The fixture is all the shots ever see: they are public.
#
# This is the untrusted half: it runs the PR's code and its npm dependencies, so it holds no token that can write,
# and uploads the shots as an artifact. Each run's end starts screenshots-publish.yml (`workflow_run`: main's copy,
# never the PR's), which compares them, updates the PR's comment and sets the PR head's `screenshots` status, the
# gate (a required check): pending while changed shots wait for the user to tick the approval box in the comment,
# failure only when something is broken. Same machine, same Chrome, same fonts on both sides, so the comparison is
# the bytes: no threshold, no masks.
#
# `pull_request`, never `pull_request_target` (see ci.yml). Every PR push runs it, not only those a `paths` filter
# would match: that filter compares the whole PR with main, so a push taking the PR's last web change back wouldn't
# run it, the comment would go on showing the change and the head would never get its status. render looks at the
# merge's diff itself and, when the web UI didn't change, shoots nothing (seconds).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    # a fork's PR gets no token that can write, so nothing of it could be published: skipped
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # the merge commit (after) and its first parent (before: main as GitHub merged the PR into it)
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # what the shots depend on; without a change there, an empty manifest: screenshots-publish.yml then passes the
      # status and only brings an earlier comment up to date
      - name: Did the web UI change?
        id: diff
        run: |
          if git diff --quiet HEAD^1 HEAD -- web vite.config.ts package.json package-lock.json 'tsconfig*.json' \
            tools/e2e.ts tools/shots-fixture.ts .github/workflows/screenshots.yml; then
            mkdir -p "$RUNNER_TEMP/shots" && echo '{"shots": []}' > "$RUNNER_TEMP/shots/manifest.json"
          else
            echo "web=1" >> "$GITHUB_OUTPUT"
          fi

      # as in ci.yml's e2e job: Chrome's first start on a fresh runner's cold disk (0.6–17 s), here in the
      # background while the builds run, so the shots' own start is a warm one
      - name: Warm Chrome up
        if: steps.diff.outputs.web
        run: google-chrome-stable --headless=new --user-data-dir="$RUNNER_TEMP/chrome-warm" --dump-dom about:blank > /dev/null 2>&1 &

      - name: Set up Node.js
        if: steps.diff.outputs.web
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json # its engines.node
          cache: npm

      # --ignore-scripts as in ci.yml. No tsc: ci.yml type-checks, the shots need the build only.
      - name: Build the web UI after the PR
        if: steps.diff.outputs.web
        run: npm ci --ignore-scripts && npx vite build

      - name: Build the web UI before it
        if: steps.diff.outputs.web
        run: |
          git worktree add "$RUNNER_TEMP/before" HEAD^1
          cd "$RUNNER_TEMP/before"
          npm ci --ignore-scripts
          npx vite build

      # the PR's harness and fixture shoot both builds: only the web build differs
      - name: Shoot
        if: steps.diff.outputs.web
        run: node tools/e2e.ts shots --before "$RUNNER_TEMP/before/web/dist" --after web/dist --out "$RUNNER_TEMP/shots"

      - name: Upload the shots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shots
          path: ${{ runner.temp }}/shots
          retention-days: 30 # a tick in the comment decides on them again
          if-no-files-found: error
